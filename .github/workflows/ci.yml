# Kalite kapilari. Bir kapinin gecmesi icin testi zayiflatmak KABUL EDILMEZ.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Bagimliliklari kur
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Ruff (kod kalitesi + bandit kurallari)
        run: ruff check .

      - name: Migration zinciri (temiz veritabani)
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret-000000000000
          SECRETS_ENCRYPTION_KEY: ci-only-not-a-real-key-0000000000
        run: python -m alembic upgrade head

      - name: pytest
        run: python -m pytest --junitxml=junit.xml

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: junit.xml

  frontend:
    name: Frontend (lint + tip + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Kilit dosyasindan kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip denetimi + uretim derlemesi
        run: npm run build

      - name: Bagimlilik acigi taramasi
        run: npm audit --audit-level=high

  guvenlik:
    name: Gizli deger ve bagimlilik taramasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (gizli deger)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (Python bagimlilik CVE)
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
