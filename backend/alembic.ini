; Alembic yapilandirmasi.
; Veritabani adresi kod tarafinda (alembic/env.py) app.core.config'ten okunur;
; burada sabit bir baglanti dizesi TUTULMAZ (gizli bilgi sizmasini onlemek icin).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
; NOT: `timezone = UTC` bilinçli olarak ayarlanmadı — Windows'ta zoneinfo için
; ayrıca `tzdata` paketi gerekir; yalnızca göç dosyası başlığındaki tarih için
; bir bağımlılık eklemeye değmez. Uygulama içinde tüm zamanlar UTC'dir.

# Dosya adi: 0001_aciklama.py
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

; Otomatik üretilen göç dosyaları biçimlendirme kancasından geçirilmez;
; `ruff.toml` içinde `alembic/versions` zaten hariç tutulmuştur.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
