# Güvenlik başlıkları — TEK KAYNAK.
#
# nginx'te `add_header` miras alınmaz: bir `location` bloğu kendi `add_header`
# satırını yazdığında üst bloktaki tüm başlıklar o konum için düşer. Bu yüzden
# başlıklar burada toplanır ve başlık ekleyen her blokta `include` edilir.
#
# Backend kendi yanıtlarına bu başlıkları ayrıca ekler; buradaki set statik
# dosyalar ve vekillenen yanıtlar için ağı kapatır.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
