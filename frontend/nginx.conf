# Arayüzü sunar ve /api isteklerini backend'e vekiller.
# TLS sonlandırması bu katmanda YAPILMAZ; üretimde bir ters vekil (Traefik,
# Caddy, nginx) arkasına alın.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------- güvenlik başlıkları
    # DİKKAT — nginx'te `add_header` MİRAS ALINMAZ, DEĞİŞTİRİLİR: bir `location`
    # bloğu kendi `add_header` satırını yazdığı anda üst bloktaki TÜM `add_header`
    # yönergeleri o konum için DÜŞER. Başlıklar yalnızca `server` seviyesinde
    # tanımlanırsa, `add_header` kullanan her `location` sessizce başlıksız kalır —
    # `/assets/` bloğu tam olarak bu yüzden korumasızdı.
    #
    # Bu yüzden başlıklar tek bir parçacık dosyasında toplanır ve başlık ekleyen
    # HER `location` bloğunda yeniden dâhil edilir. Yeni bir `location` içinde
    # `add_header` yazacaksanız bu `include` satırını da eklemeyi unutmayın.
    include /etc/nginx/snippets/guvenlik-basliklari.conf;

    # Hash'li varlıklar uzun süre önbelleklenir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Üstteki güvenlik başlıkları bu blokta düştüğü için yeniden eklenir.
        include /etc/nginx/snippets/guvenlik-basliklari.conf;
        try_files $uri =404;
    }

    # API ve sağlık kontrolü backend'e
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Yapay zekâ istekleri uzun sürebilir (yerel model ilk yüklemede yavaş)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        # Akış (SSE) yanıtları tamponlanmamalı
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://backend:8010/health;
        access_log off;
    }

    # Tek sayfa uygulaması yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }
}
